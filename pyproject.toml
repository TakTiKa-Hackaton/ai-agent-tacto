[project]
name = "tactika-buyer-agent"
version = "1.0.0"
description = "Evidence-led procurement agent for the Tacto Negotiation Arena"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "mcp>=2.3,<3",
  "openpyxl>=3.1",
  "pypdf>=5",
  "python-dotenv>=1.0",
]

[project.scripts]
taktika = "tactika_agent.runner:main"
taktika-mcp = "tactika_agent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tactika_agent"]
