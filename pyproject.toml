[project]
name = "tactika-buyer-agent"
version = "1.0.0"
description = "Evidence-led procurement agent for the Tacto Negotiation Arena"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "arena-kit @ git+https://github.com/tacto-ai/negotiation-arena-kit.git#subdirectory=starter-kit",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.scripts]
taktika = "tactika_agent.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tactika_agent"]
